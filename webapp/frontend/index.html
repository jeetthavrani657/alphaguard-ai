<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaGuard AI</title>
    <meta name="description" content="AlphaGuard AI: a read-only backtesting research terminal for NSE equities. Every edge, tested against the number of things you tried." />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <!-- Avoids a flash of the wrong theme before the stylesheet loads. The real theme is src/styles.css, and the choice is remembered by src/useTheme.ts. -->
    <style>html, body { background: #0b0f14; } html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f9; }</style>
    <script>try{var t=localStorage.getItem("alphaguard-theme");if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
