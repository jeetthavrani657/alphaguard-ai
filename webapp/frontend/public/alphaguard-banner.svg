<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="AlphaGuard AI: every edge, tested against the number of things you tried">
  <title>AlphaGuard AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1624"/><stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="250" cy="150" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fd0c0" stop-opacity=".22"/><stop offset="1" stop-color="#2fd0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1100" cy="40" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4da3ff" stop-opacity=".20"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cb8ff"/><stop offset="1" stop-color="#2fd0c0"/>
    </linearGradient>
    <linearGradient id="fill" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16263a"/><stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
    <linearGradient id="alpha" x1="16" y1="26" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#3fe0c8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#3fe0c8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- a faint equity curve running behind the text -->
  <path d="M0 262 C120 252 190 268 300 238 C420 205 470 246 590 214 C720 180 780 226 900 176 C1030 124 1110 160 1280 96"
        fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity=".28"/>

  <!-- the mark (same drawing as alphaguard-mark.svg, scaled 3x) -->
  <g transform="translate(78 62) scale(3.2)">
    <path d="M32 3.5 L55.5 11.5 V30 C55.5 45.2 46.2 55 32 60.5 C17.8 55 8.5 45.2 8.5 30 V11.5 Z" fill="url(#fill)" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M46.5 44.5 C41 44.5 38 38 34 33 C30 28 22 27 19 33 C16 39.5 21 45.5 28 43 C34 40.5 38 33 41.5 28.5 C43 26.5 45 26 47 27" fill="none" stroke="url(#alpha)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 14 L32 7.5" stroke="#fff" stroke-opacity=".18" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="318" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-1.5" fill="#f1f5fa">Alpha<tspan fill="url(#word)">Guard</tspan><tspan fill="#8494a8" font-weight="500" dx="18">AI</tspan></text>
  <text x="322" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" fill="#b9c6d6">Every edge, tested against the number of things you tried.</text>
  <text x="322" y="252" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="20" letter-spacing="2" fill="#6f8197">BACKTESTING RESEARCH TERMINAL  ·  NSE EQUITIES  ·  READ-ONLY</text>
</svg>
