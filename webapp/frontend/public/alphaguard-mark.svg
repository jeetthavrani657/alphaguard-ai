<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AlphaGuard AI">
  <title>AlphaGuard AI</title>
  <defs>
    <linearGradient id="ag-edge" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cb8ff"/>
      <stop offset="1" stop-color="#2fd0c0"/>
    </linearGradient>
    <linearGradient id="ag-fill" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16263a"/>
      <stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
    <linearGradient id="ag-alpha" x1="16" y1="26" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#3fe0c8"/>
    </linearGradient>
  </defs>
  <!-- the guard: a shield -->
  <path d="M32 3.5 L55.5 11.5 V30 C55.5 45.2 46.2 55 32 60.5 C17.8 55 8.5 45.2 8.5 30 V11.5 Z"
        fill="url(#ag-fill)" stroke="url(#ag-edge)" stroke-width="3" stroke-linejoin="round"/>
  <!-- the alpha: one continuous stroke, loop on the left, tail rising to the right -->
  <path d="M46.5 44.5 C41 44.5 38 38 34 33 C30 28 22 27 19 33 C16 39.5 21 45.5 28 43 C34 40.5 38 33 41.5 28.5 C43 26.5 45 26 47 27"
        fill="none" stroke="url(#ag-alpha)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a quiet highlight on the shield's upper-left edge -->
  <path d="M13 14 L32 7.5" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6" stroke-linecap="round"/>
</svg>
